version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: minesweeper-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "127.0.0.1:${DB_PORT}:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    env_file: 
      - .env

volumes:
  postgres_data:
